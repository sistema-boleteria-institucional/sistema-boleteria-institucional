<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Puerta</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 20px; color: #38bdf8; }
        #reader { width: 100%; max-width: 420px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-resultado { margin-top: 25px; max-width: 420px; width: 100%; padding: 20px; border-radius: 12px; text-align: center; font-size: 1.2rem; display: none; }
        .permitido { background-color: #166534; border: 2px solid #22c55e; }
        .denegado { background-color: #991b1b; border: 2px solid #ef4444; }
    </style>
</head>
<body>

    <h1>Control de Acceso Puerta</h1>
    <div id="reader"></div>
    <div id="cardResultado" class="card-resultado"></div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        let escaneando = false;

        async function alDetectarQR(qrDataText) {
            if (escaneando) return;
            escaneando = true;

            try {
                const dataObj = JSON.parse(qrDataText);
                const res = await fetch('/api/validar-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataObj)
                });
                const resultado = await res.json();
                mostrarPantalla(resultado);
            } catch (e) {
                mostrarPantalla({ valido: false, razon: 'QR Inválido', mensaje: 'Código QR no reconocido' });
            }

            setTimeout(() => { escaneando = false; }, 3000);
        }

        function mostrarPantalla(res) {
            const card = document.getElementById('cardResultado');
            card.style.display = 'block';

            if (res.valido) {
                card.className = 'card-resultado permitido';
                card.innerHTML = `
                    <h2>ACCESO PERMITIDO</h2>
                    <p><strong>Cliente:</strong> ${res.cliente}</p>
                    <p><strong>Asiento:</strong> ${res.asiento}</p>`;
            } else {
                card.className = 'card-resultado denegado';
                card.innerHTML = `
                    <h2>ACCESO DENEGADO</h2>
                    <p><strong>Razón:</strong> ${res.razon || 'Ticket no válido'}</p>
                    <p><small>${res.mensaje}</small></p>`;
            }
        }

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            alDetectarQR
        );
    </script>
</body>
</html>
