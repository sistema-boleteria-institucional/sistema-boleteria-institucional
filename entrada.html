<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada Digital - Pass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .ticket-card {
            max-width: 420px;
            margin: 40px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #fff;
        }
        .ticket-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .ticket-body { padding: 25px; }
        .qr-container { text-align: center; padding: 15px; background: #fafafa; border-radius: 10px; border: 1px dashed #ccc; }
        .qr-container img { width: 180px; height: 180px; }
    </style>
</head>
<body>

    <div class="ticket-card" id="ticketContent">
        <div class="ticket-header">
            <h4 class="mb-1" id="nombreEvento">Cargando...</h4>
            <small class="text-white-50">ENTRADA OFICIAL</small>
        </div>
        <div class="ticket-body">
            <div class="mb-3">
                <small class="text-muted d-block">Titular</small>
                <strong id="nombreCliente" class="fs-5">-</strong>
            </div>

            <div class="row mb-3">
                <div class="col-6">
                    <small class="text-muted d-block">Fecha</small>
                    <strong id="fechaEvento">-</strong>
                </div>
                <div class="col-6">
                    <small class="text-muted d-block">Hora</small>
                    <strong id="horaEvento">-</strong>
                </div>
            </div>

            <div class="mb-4 text-center p-2 bg-light rounded">
                <small class="text-muted d-block">Ubicación / Asiento</small>
                <span id="asientoCliente" class="badge bg-primary fs-4 mt-1">-</span>
            </div>

            <div class="qr-container">
                <img id="imgQR" src="" alt="Cargando QR...">
                <small class="d-block text-muted mt-2">Muestra este QR en el ingreso</small>
            </div>
        </div>
    </div>

    <script>
        async function cargarTicket() {
            const params = new URLSearchParams(window.location.search);
            const ventaId = params.get('id');

            if (!ventaId) {
                alert('Entrada no válida o ID faltante');
                return;
            }

            const res = await fetch(`/api/entradas/${ventaId}`);
            const data = await res.json();

            if (!data.exito) {
                alert(data.mensaje);
                return;
            }

            const t = data.ticket;
            document.getElementById('nombreEvento').innerText = t.evento_nombre;
            document.getElementById('nombreCliente').innerText = `${t.nombre} ${t.apellido}`;
            document.getElementById('fechaEvento').innerText = t.evento_fecha;
            document.getElementById('horaEvento').innerText = `${t.evento_hora} hs`;
            document.getElementById('asientoCliente').innerText = t.codigoAsiento;
            document.getElementById('imgQR').src = t.qr;
        }

        cargarTicket();
    </script>
</body>
</html>
