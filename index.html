<script>
    let operarioActualId = null;
    let asientoSeleccionado = null;

    // 1. Cargar lista de eventos al iniciar la página
    window.addEventListener('DOMContentLoaded', () => {
        cargarEventosEnSelect();
    });

    // Autenticación de Operario
    function iniciarSesion() {
        const input = document.getElementById('operarioInput').value;
        if(!input) return alert('Ingrese un ID de operario válido');
        
        operarioActualId = input;
        document.getElementById('lblOperario').innerText = `ID #${operarioActualId}`;
        document.getElementById('modalLogin').style.display = 'none';
    }

    // Cambio de Pestañas
    function mostrarTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    // Cargar la lista de eventos guardados en el menú desplegable (Select)
    async function cargarEventosEnSelect() {
        try {
            const res = await fetch('/api/eventos');
            const eventos = await res.json();
            const select = document.getElementById('selEventoVenta');
            
            select.innerHTML = '<option value="">-- Seleccionar Evento --</option>';
            eventos.forEach(ev => {
                const opt = document.createElement('option');
                opt.value = ev.id;
                opt.innerText = `${ev.nombre} (${ev.fecha} - ${ev.hora})`;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error('Error al cargar eventos:', err);
        }
    }

    // Crear Evento y Generar Mapa
    async function crearEvento() {
        const body = {
            id: document.getElementById('evId').value,
            nombre: document.getElementById('evNombre').value,
            fecha: document.getElementById('evFecha').value,
            hora: document.getElementById('evHora').value,
            precioGeneral: parseFloat(document.getElementById('evPrecioGen').value),
            precioGradas: parseFloat(document.getElementById('evPrecioGrada').value),
            totalDisponiblesGeneral: parseInt(document.getElementById('evDispGen').value),
            totalDisponiblesGradas: parseInt(document.getElementById('evDispGrada').value)
        };

        if(!body.id || !body.nombre || !body.fecha || !body.hora) {
            return alert('Por favor completa todos los datos obligatorios del evento.');
        }

        const res = await fetch('/api/eventos/crear', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });

        const data = await res.json();
        if(data.exito) {
            alert('¡Evento creado y mapa generado correctamente!');
            await cargarEventosEnSelect(); // Actualiza el listado sin reiniciar
            document.getElementById('selEventoVenta').value = body.id; // Selecciona el evento creado
            mostrarTab('tabVenta'); // Cambia a la pestaña de ventas
            cargarMapaAsientos(); // Renderiza el mapa inmediatamente
        } else {
            alert('Error al guardar: ' + (data.error || data.mensaje));
        }
    }

    // Cargar mapa visual de asientos
    async function cargarMapaAsientos() {
        const eventoId = document.getElementById('selEventoVenta').value;
        if(!eventoId) return;

        const res = await fetch(`/api/eventos/${eventoId}/asientos`);
        const asientos = await res.json();

        const gridGeneral = document.getElementById('gridGeneral');
        const gridGrada1 = document.getElementById('gridGrada1');
        const gridGrada2 = document.getElementById('gridGrada2');

        gridGeneral.innerHTML = '';
        gridGrada1.innerHTML = '';
        gridGrada2.innerHTML = '';

        asientos.forEach(a => {
            const el = document.createElement('div');
            let estadoClass = 'disponible';
            if(!a.habilitado) estadoClass = 'bloqueado';
            if(a.vendido) estadoClass = 'vendido';

            el.className = `asiento ${estadoClass}`;
            el.innerText = a.codigoAsiento.replace('GEN-', '');

            if(a.habilitado && !a.vendido) {
                el.onclick = () => seleccionarAsiento(a, el);
            }

            if(a.tipoZona === 'General') {
                gridGeneral.appendChild(el);
            } else if(a.codigoAsiento.startsWith('G1')) {
                gridGrada1.appendChild(el);
            } else if(a.codigoAsiento.startsWith('G2')) {
                gridGrada2.appendChild(el);
            }
        });
    }

    function seleccionarAsiento(asiento, elemento) {
        document.querySelectorAll('.asiento').forEach(a => a.classList.remove('seleccionado'));
        elemento.classList.add('seleccionado');
        asientoSeleccionado = asiento;

        document.getElementById('lblAsiento').innerText = asiento.codigoAsiento;
        document.getElementById('lblPrecio').innerText = `$${asiento.precio}`;
    }

    // Registrar Venta
    async function procesarVenta() {
        if(!asientoSeleccionado) return alert('Seleccione un asiento');

        const body = {
            eventoId: document.getElementById('selEventoVenta').value,
            codigoAsiento: asientoSeleccionado.codigoAsiento,
            metodoPago: document.getElementById('selMetodoPago').value,
            clienteNombre: document.getElementById('txtNombre').value,
            clienteApellido: document.getElementById('txtApellido').value,
            clienteContacto: document.getElementById('txtContacto').value,
            clienteEmail: document.getElementById('txtEmail').value,
            operarioId: operarioActualId
        };

        if(!body.clienteNombre || !body.clienteApellido || !body.clienteContacto) {
            return alert('Por favor complete los campos obligatorios (*)');
        }

        const res = await fetch('/api/ventas/registrar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });

        const data = await res.json();
        const msgDiv = document.getElementById('msgVenta');

        if(data.exito) {
            msgDiv.innerHTML = `<p style="color:#22c55e;">✅ Venta Exitosa #${data.idReserva}</p>`;
            asientoSeleccionado = null;
            document.getElementById('lblAsiento').innerText = 'Ninguno';
            document.getElementById('lblPrecio').innerText = '$0';
            cargarMapaAsientos();
        } else {
            msgDiv.innerHTML = `<p style="color:#ef4444;">❌ ${data.mensaje}</p>`;
        }
    }
</script>
