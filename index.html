<!-- FORMULARIO CREAR USUARIOS (SOLO ADMINISTRADORES) -->
<div id="secCrearUsuario" style="background: #0f172a; padding: 20px; border-radius: 8px; margin-top: 20px;">
    <h3>Gestión de Usuarios (Solo Adm)</h3>
    
    <div class="form-group">
        <label>Nombre de Usuario:</label>
        <input type="text" id="usrNombre" placeholder="Ej: juancito">
    </div>
    
    <div class="form-group">
        <label>Identificación (ID Operario):</label>
        <input type="text" id="usrIdentificacion" placeholder="Ej: OP-002">
    </div>

    <div class="form-group">
        <label>Contraseña / Clave:</label>
        <input type="password" id="usrClave" placeholder="******">
    </div>

    <div class="form-group">
        <label>Tipo de Usuario:</label>
        <select id="usrTipo">
            <option value="vendedor">Vendedor</option>
            <option value="adm">Administrador (ADM)</option>
        </select>
    </div>

    <button class="btn-primary" onclick="guardarNuevoUsuario()">Registrar Usuario</button>
</div>

<script>
async function guardarNuevoUsuario() {
    const body = {
        usuario: document.getElementById('usrNombre').value.trim(),
        identificacion: document.getElementById('usrIdentificacion').value.trim(),
        clave: document.getElementById('usrClave').value,
        tipo: document.getElementById('usrTipo').value
    };

    const res = await fetch('/api/usuarios/crear', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });

    const data = await res.json();
    alert(data.mensaje);
}
</script>
