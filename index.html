<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Eventos y Entradas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 5px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; background-color: #1e293b; color: #94a3b8; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .tab-btn.active { background-color: #0284c7; color: #ffffff; }

        .tab-content { display: none; background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #ffffff; }
        
        .btn-primary { background-color: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-primary:hover { background-color: #0369a1; }

        /* Mapa de asientos */
        .stage { background: #334155; color: #94a3b8; text-align: center; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px; }
        .zone-title { margin: 15px 0 10px; color: #38bdf8; font-size: 1.1em; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        
        .grid-general { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; margin-bottom: 20px; }
        .grid-gradas { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; margin-bottom: 20px; }

        .seat { aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; cursor: pointer; user-select: none; }
        .seat.libre { background-color: #22c55e; color: #ffffff; }
        .seat.ocupado { background-color: #ef4444; color: #ffffff; cursor: not-allowed; }
        .seat.seleccionado { background-color: #eab308; color: #000000; }

        .legend { display: flex; gap: 20px; margin-bottom: 20px; justify-content: center; background: #0f172a; padding: 10px; border-radius: 6px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
        .legend-box { width: 16px; height: 16px; border-radius: 3px; }

        .ticket-box { background: #0f172a; padding: 15px; border-radius: 6px; margin-top: 15px; border: 1px dashed #0284c7; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
        th { background-color: #0f172a; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Panel de Gestión de Eventos</h1>
        <p>Reserva y Control de Localidades</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('tabVenta')">Venta de Entradas</button>
        <button class="tab-btn" onclick="openTab('tabCrearEvento')">Crear / Editar Evento</button>
        <button class="tab-btn" onclick="openTab('tabCupones')">Cupones</button>
        <button class="tab-btn" onclick="openTab('tabInformes')">Informes</button>
    </div>

    <!-- PESTAÑA VENTA -->
    <div id="tabVenta" class="tab-content active">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
            <div>
                <div class="form-group">
                    <label>Seleccionar Evento:</label>
                    <select id="selEventoVenta" onchange="cargarMapaAsientos()"></select>
                </div>

                <div class="legend">
                    <div class="legend-item"><div class="legend-box" style="background:#22c55e;"></div> Libre</div>
                    <div class="legend-item"><div class="legend-box" style="background:#ef4444;"></div> Ocupado</div>
                    <div class="legend-item"><div class="legend-box" style="background:#eab308;"></div> Seleccionado</div>
                </div>

                <div class="stage">ESCENARIO</div>

                <div class="zone-title">Zona General</div>
                <div id="gridGeneral" class="grid-general"></div>

                <div class="zone-title">Zona Gradas</div>
                <div id="gridGradas" class="grid-gradas"></div>
            </div>

            <div>
                <div class="ticket-box">
                    <h3>Detalle de Reserva</h3>
                    <br>
                    <div class="form-group"><label>Asiento Seleccionado:</label><input type="text" id="resAsiento" readonly placeholder="Ninguno"></div>
                    <div class="form-group"><label>Zona:</label><input type="text" id="resZona" readonly></div>
                    <div class="form-group"><label>Precio Base ($):</label><input type="text" id="resPrecio" readonly></div>
                    
                    <div class="form-group">
                        <label>Cupón de Descuento:</label>
                        <div style="display:flex; gap:5px;">
                            <input type="text" id="resCupon" placeholder="CODIGO">
                            <button type="button" style="width: auto; padding: 0 10px;" class="btn-primary" onclick="aplicarCupon()">Aplicar</button>
                        </div>
                    </div>
                    <div class="form-group"><label>Monto Final ($):</label><input type="text" id="resMontoFinal" readonly></div>

                    <hr style="border-color:#334155; margin: 15px 0;">

                    <div class="form-group"><label>Nombre Cliente:</label><input type="text" id="resCliente"></div>
                    <div class="form-group"><label>DNI:</label><input type="text" id="resDni"></div>
                    <div class="form-group"><label>Teléfono:</label><input type="text" id="resTel"></div>
                    <div class="form-group">
                        <label>Método de Pago:</label>
                        <select id="resMetodo">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Tarjeta">Tarjeta de Crédito/Débito</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Nº Transacción / Ref:</label><input type="text" id="resTransaccion"></div>
                    <div class="form-group">
                        <label><input type="checkbox" id="resPagado" checked style="width:auto;"> ¿Marcado como Pagado?</label>
                    </div>

                    <button class="btn-primary" onclick="confirmarVenta()">Confirmar Reserva / Venta</button>
                    <button id="btnLiberar" class="btn-primary" style="background-color:#ef4444; margin-top:10px; display:none;" onclick="liberarAsiento()">Liberar Asiento</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PESTAÑA CREAR / EDITAR EVENTO -->
    <div id="tabCrearEvento" class="tab-content">
        <h3>Crear / Configurar Evento</h3>
        <div style="max-width: 500px;">
            <div class="form-group">
                <label>Seleccionar Evento para Editar (Opcional):</label>
                <select id="selEventoEditar" style="width: 100%; padding: 8px; border-radius: 4px; background: #1e293b; color: #fff; border: 1px solid #334155;" onchange="cargarDatosEventoParaEditar()">
                    <option value="">-- Crear Nuevo Evento --</option>
                </select>
            </div>

            <hr style="border-color: #334155; margin: 15px 0;">

            <div class="form-group"><label>ID Evento (Único):</label><input type="text" id="evId" placeholder="EV-2026"></div>
            <div class="form-group"><label>Nombre Evento:</label><input type="text" id="evNombre" placeholder="Festival de Música"></div>
            <div class="form-group"><label>Fecha:</label><input type="date" id="evFecha"></div>
            <div class="form-group"><label>Hora:</label><input type="time" id="evHora"></div>
            
            <hr style="border-color: #334155; margin: 15px 0;">

            <div class="form-group">
                <label>Precio General ($):</label>
                <input type="number" id="evPrecioGen" value="1500" min="0">
            </div>
            <div class="form-group" id="grpDispGen">
                <label>Cantidad Asientos General (Máximo 112):</label>
                <input type="number" id="evDispGen" value="112" min="1" max="112">
            </div>

            <hr style="border-color: #334155; margin: 15px 0;">

            <div class="form-group">
                <label>Precio Gradas ($):</label>
                <input type="number" id="evPrecioGrada" value="3000" min="0">
            </div>
            <div class="form-group" id="grpDispGrada">
                <label>Cantidad Asientos Gradas (Máximo 24):</label>
                <input type="number" id="evDispGrada" value="24" min="1" max="24">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btnGuardarEvento" class="btn-primary" onclick="crearEvento()">Guardar Evento Nuevo</button>
                <button id="btnModificarEvento" class="btn-primary" style="background: #eab308; display: none;" onclick="modificarEvento()">Guardar Cambios Evento</button>
                <button id="btnCancelarEdicionEv" class="btn-primary" style="background: #475569; display: none;" onclick="limpiarFormularioEvento()">Limpiar / Nuevo</button>
            </div>
        </div>
    </div>

    <!-- PESTAÑA CUPONES -->
    <div id="tabCupones" class="tab-content">
        <h3>Crear Cupón de Descuento</h3>
        <div style="max-width: 500px;">
            <div class="form-group">
                <label>Evento:</label>
                <select id="cupEventoId"></select>
            </div>
            <div class="form-group"><label>Código del Cupón:</label><input type="text" id="cupCodigo" placeholder="PROMO10"></div>
            <div class="form-group"><label>Porcentaje Descuento (%):</label><input type="number" id="cupPorcentaje" placeholder="10"></div>
            <div class="form-group"><label>Límite Usos:</label><input type="number" id="cupMax" value="10"></div>
            <button class="btn-primary" onclick="crearCupon()">Crear Cupón</button>
        </div>
    </div>

    <!-- PESTAÑA INFORMES -->
    <div id="tabInformes" class="tab-content">
        <h3>Informes y Reportes</h3>
        <div class="form-group" style="max-width:300px;">
            <label>Seleccionar Evento:</label>
            <select id="selEventoInforme" onchange="cargarInforme()"></select>
        </div>

        <div id="resumenInforme" style="margin-bottom: 20px; font-size: 1.1em;"></div>

        <table id="tablaVentas">
            <thead>
                <tr>
                    <th>Asiento</th>
                    <th>Zona</th>
                    <th>Cliente</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Método Pago</th>
                    <th>Transacción</th>
                    <th>Monto</th>
                    <th>Estado Pago</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    let asientoSeleccionado = null;
    let descuentoAplicado = 0;

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');

        if(tabId === 'tabVenta') cargarEventosEnSelect();
        if(tabId === 'tabCrearEvento') cargarEventosEnSelect();
        if(tabId === 'tabCupones') cargarEventosEnSelect();
        if(tabId === 'tabInformes') cargarEventosEnSelect();
    }

    async function cargarEventosEnSelect() {
        try {
            const res = await fetch('/api/eventos');
            if(!res.ok) return;
            const eventos = await res.json();
            
            const selVenta = document.getElementById('selEventoVenta');
            const selInf = document.getElementById('selEventoInforme');
            const selCup = document.getElementById('cupEventoId');
            const selEdit = document.getElementById('selEventoEditar');
            
            selVenta.innerHTML = '<option value="">-- Seleccionar Evento --</option>';
            selInf.innerHTML = '<option value="">-- Seleccionar Evento --</option>';
            if (selCup) selCup.innerHTML = '<option value="">-- Seleccionar Evento --</option>';
            if (selEdit) selEdit.innerHTML = '<option value="">-- Crear Nuevo Evento --</option>';

            if(Array.isArray(eventos)){
                eventos.forEach(ev => {
                    const opt = `<option value="${ev.id}">${ev.nombre} (${ev.fecha})</option>`;
                    selVenta.innerHTML += opt;
                    selInf.innerHTML += opt;
                    if (selCup) selCup.innerHTML += opt;
                    if (selEdit) selEdit.innerHTML += opt;
                });
            }
        } catch (err) {
            console.error("Error al obtener eventos:", err);
        }
    }

    async function cargarDatosEventoParaEditar() {
        const id = document.getElementById('selEventoEditar').value;
        if (!id) {
            limpiarFormularioEvento();
            return;
        }

        try {
            const res = await fetch('/api/eventos');
            const eventos = await res.json();
            const ev = eventos.find(x => x.id === id);

            if (ev) {
                document.getElementById('evId').value = ev.id;
                document.getElementById('evId').disabled = true;
                document.getElementById('evNombre').value = ev.nombre;
                document.getElementById('evFecha').value = ev.fecha;
                document.getElementById('evHora').value = ev.hora;
                document.getElementById('evPrecioGen').value = ev.precioGeneral;
                document.getElementById('evPrecioGrada').value = ev.precioGradas;

                document.getElementById('grpDispGen').style.display = 'none';
                document.getElementById('grpDispGrada').style.display = 'none';

                document.getElementById('btnGuardarEvento').style.display = 'none';
                document.getElementById('btnModificarEvento').style.display = 'block';
                document.getElementById('btnCancelarEdicionEv').style.display = 'block';
            }
        } catch (e) {
            console.error("Error al cargar evento:", e);
        }
    }

    function limpiarFormularioEvento() {
        document.getElementById('selEventoEditar').value = '';
        document.getElementById('evId').value = '';
        document.getElementById('evId').disabled = false;
        document.getElementById('evNombre').value = '';
        document.getElementById('evFecha').value = '';
        document.getElementById('evHora').value = '';
        document.getElementById('evPrecioGen').value = '1500';
        document.getElementById('evDispGen').value = '112';
        document.getElementById('evPrecioGrada').value = '3000';
        document.getElementById('evDispGrada').value = '24';

        document.getElementById('grpDispGen').style.display = 'block';
        document.getElementById('grpDispGrada').style.display = 'block';

        document.getElementById('btnGuardarEvento').style.display = 'block';
        document.getElementById('btnModificarEvento').style.display = 'none';
        document.getElementById('btnCancelarEdicionEv').style.display = 'none';
    }

    async function crearEvento() {
        const body = {
            id: document.getElementById('evId').value.trim(),
            nombre: document.getElementById('evNombre').value.trim(),
            fecha: document.getElementById('evFecha').value,
            hora: document.getElementById('evHora').value,
            precioGeneral: parseFloat(document.getElementById('evPrecioGen').value) || 0,
            cantGen: parseInt(document.getElementById('evDispGen').value) || 112,
            precioGradas: parseFloat(document.getElementById('evPrecioGrada').value) || 0,
            cantGradas: parseInt(document.getElementById('evDispGrada').value) || 24
        };

        if(!body.id || !body.nombre || !body.fecha || !body.hora) return alert('Completa todos los campos obligatorios del evento.');

        try {
            const res = await fetch('/api/eventos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            alert(data.mensaje);
            if(data.exito) {
                limpiarFormularioEvento();
                cargarEventosEnSelect();
            }
        } catch (e) {
            alert('Error al crear evento');
        }
    }

    async function modificarEvento() {
        const body = {
            id: document.getElementById('evId').value.trim(),
            nombre: document.getElementById('evNombre').value.trim(),
            fecha: document.getElementById('evFecha').value,
            hora: document.getElementById('evHora').value,
            precioGeneral: parseFloat(document.getElementById('evPrecioGen').value) || 0,
            precioGradas: parseFloat(document.getElementById('evPrecioGrada').value) || 0
        };

        if (!body.id || !body.nombre || !body.fecha || !body.hora) {
            return alert('Completa todos los campos obligatorios del evento.');
        }

        try {
            const res = await fetch('/api/eventos/modificar', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            alert(data.mensaje);

            if (data.exito) {
                limpiarFormularioEvento();
                cargarEventosEnSelect();
            }
        } catch (e) {
            alert('Error al modificar el evento.');
        }
    }

    async function cargarMapaAsientos() {
        const eventoId = document.getElementById('selEventoVenta').value;
        const gridGen = document.getElementById('gridGeneral');
        const gridGrada = document.getElementById('gridGradas');
        
        gridGen.innerHTML = '';
        gridGrada.innerHTML = '';
        limpiarFormularioReserva();

        if(!eventoId) return;

        try {
            const res = await fetch(`/api/asientos/${eventoId}`);
            const asientos = await res.json();

            asientos.forEach(a => {
                const el = document.createElement('div');
                el.className = `seat ${a.estado}`;
                el.innerText = a.numero;
                el.onclick = () => seleccionarAsiento(a);

                if(a.tipoZona === 'General') {
                    gridGen.appendChild(el);
                } else {
                    gridGrada.appendChild(el);
                }
            });
        } catch (e) {
            console.error('Error al cargar mapa:', e);
        }
    }

    function seleccionarAsiento(asiento) {
        asientoSeleccionado = asiento;
        descuentoAplicado = 0;

        document.getElementById('resAsiento').value = `Asiento #${asiento.numero}`;
        document.getElementById('resZona').value = asiento.tipoZona;
        document.getElementById('resPrecio').value = asiento.precio;
        document.getElementById('resMontoFinal').value = asiento.precio;
        document.getElementById('resCupon').value = '';

        if(asiento.estado === 'ocupado') {
            document.getElementById('resCliente').value = asiento.cliente || '';
            document.getElementById('resDni').value = asiento.dni || '';
            document.getElementById('resTel').value = asiento.telefono || '';
            document.getElementById('resMetodo').value = asiento.metodoPago || 'Efectivo';
            document.getElementById('resTransaccion').value = asiento.transaccion || '';
            document.getElementById('resPagado').checked = asiento.pagado == 1;
            document.getElementById('btnLiberar').style.display = 'block';
        } else {
            document.getElementById('resCliente').value = '';
            document.getElementById('resDni').value = '';
            document.getElementById('resTel').value = '';
            document.getElementById('resTransaccion').value = '';
            document.getElementById('resPagado').checked = true;
            document.getElementById('btnLiberar').style.display = 'none';
        }
    }

    async function aplicarCupon() {
        if(!asientoSeleccionado) return alert('Selecciona un asiento primero');
        const codigo = document.getElementById('resCupon').value.trim();
        const eventoId = document.getElementById('selEventoVenta').value;

        if(!codigo) return;

        try {
            const res = await fetch('/api/cupones/validar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventoId, codigo })
            });
            const data = await res.json();
            if(data.valido) {
                descuentoAplicado = data.porcentaje;
                const precio = asientoSeleccionado.precio;
                const total = precio - (precio * (descuentoAplicado / 100));
                document.getElementById('resMontoFinal').value = total.toFixed(2);
                alert(`Cupón aplicado: ${descuentoAplicado}% de descuento`);
            } else {
                alert(data.mensaje);
            }
        } catch(e) {
            alert('Error al validar cupón');
        }
    }

    async function confirmarVenta() {
        if(!asientoSeleccionado) return alert('Selecciona un asiento');
        const eventoId = document.getElementById('selEventoVenta').value;

        const body = {
            eventoId,
            asientoId: asientoSeleccionado.id,
            cliente: document.getElementById('resCliente').value.trim(),
            dni: document.getElementById('resDni').value.trim(),
            telefono: document.getElementById('resTel').value.trim(),
            metodoPago: document.getElementById('resMetodo').value,
            transaccion: document.getElementById('resTransaccion').value.trim(),
            pagado: document.getElementById('resPagado').checked,
            cupon: document.getElementById('resCupon').value.trim(),
            descuento: descuentoAplicado
        };

        if(!body.cliente) return alert('Ingresa el nombre del cliente');

        try {
            const res = await fetch('/api/asientos/reservar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            alert(data.mensaje);
            cargarMapaAsientos();
        } catch(e) {
            alert('Error al guardar venta');
        }
    }

    async function liberarAsiento() {
        if(!asientoSeleccionado) return;
        if(!confirm('¿Estás seguro de liberar esta entrada?')) return;

        const eventoId = document.getElementById('selEventoVenta').value;

        try {
            const res = await fetch('/api/asientos/liberar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventoId, asientoId: asientoSeleccionado.id })
            });
            const data = await res.json();
            alert(data.mensaje);
            cargarMapaAsientos();
        } catch(e) {
            alert('Error al liberar asiento');
        }
    }

    function limpiarFormularioReserva() {
        asientoSeleccionado = null;
        document.getElementById('resAsiento').value = '';
        document.getElementById('resZona').value = '';
        document.getElementById('resPrecio').value = '';
        document.getElementById('resMontoFinal').value = '';
        document.getElementById('resCliente').value = '';
        document.getElementById('resDni').value = '';
        document.getElementById('resTel').value = '';
        document.getElementById('resTransaccion').value = '';
        document.getElementById('btnLiberar').style.display = 'none';
    }

    async function crearCupon() {
        const eventoId = document.getElementById('cupEventoId').value;
        const codigo = document.getElementById('cupCodigo').value.trim();
        const porcentaje = parseFloat(document.getElementById('cupPorcentaje').value) || 0;
        const maxUsos = parseInt(document.getElementById('cupMax').value) || 1;

        if(!eventoId || !codigo) return alert('Completa los datos del cupón');

        try {
            const res = await fetch('/api/cupones', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ eventoId, codigo, porcentaje, maxUsos })
            });
            const data = await res.json();
            alert(data.mensaje);
        } catch(e) {
            alert('Error al crear cupón');
        }
    }

    async function cargarInforme() {
        const eventoId = document.getElementById('selEventoInforme').value;
        const tbody = document.querySelector('#tablaVentas tbody');
        const divResumen = document.getElementById('resumenInforme');
        tbody.innerHTML = '';
        divResumen.innerHTML = '';

        if(!eventoId) return;

        try {
            const res = await fetch(`/api/asientos/${eventoId}`);
            const asientos = await res.json();

            let recaudado = 0;
            let vendidos = 0;

            asientos.forEach(a => {
                if(a.estado === 'ocupado') {
                    vendidos++;
                    const desc = a.descuento || 0;
                    const precioFinal = a.precio - (a.precio * (desc / 100));
                    recaudado += precioFinal;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${a.numero}</td>
                        <td>${a.tipoZona}</td>
                        <td>${a.cliente || ''}</td>
                        <td>${a.dni || ''}</td>
                        <td>${a.telefono || ''}</td>
                        <td>${a.metodoPago || ''}</td>
                        <td>${a.transaccion || ''}</td>
                        <td>$${precioFinal.toFixed(2)}</td>
                        <td>${a.pagado ? 'PAGADO' : 'PENDIENTE'}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            divResumen.innerHTML = `<strong>Total Vendidos:</strong> ${vendidos} / ${asientos.length} | <strong>Recaudación Estimada:</strong> $${recaudado.toFixed(2)}`;

        } catch(e) {
            console.error('Error al cargar informe:', e);
        }
    }

    window.onload = () => {
        cargarEventosEnSelect();
    };
</script>

</body>
</html>
