<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso Puerta</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería HTML5 QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
        }

        .puerta-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        /* AMPLIA EL VISOR DE LA CÁMARA */
        #qr-reader {
            width: 100% !important;
            max-width: 500px;
            margin: 15px auto;
            border: 2px solid #334155 !important;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            max-height: 65vh !important;
            object-fit: cover !important;
        }

        #qr-reader__scan_region {
            background: rgba(0,0,0,0.2);
        }

        /* Botón para cámara nativa del celular */
        .btn-camara-nativa {
            background-color: #0d9488;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            display: block;
        }

        .resultado-box {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            display: none;
        }

        .exito { background-color: #166534; color: #4ade80; border: 1px solid #22c55e; }
        .error { background-color: #991b1b; color: #fca5a5; border: 1px solid #ef4444; }

        .manual-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .manual-input input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            width: 65%;
        }
    </style>
</head>
<body>

    <div class="puerta-container">
        <h2>📷 Control de Acceso (Puerta)</h2>
        <p style="font-size:0.85em; color:#94a3b8;">Operador: <span id="lblOperario">-</span></p>

        <!-- VISOR DE CÁMARA WEB EN VIVO (AGRANDADO) -->
        <div id="qr-reader"></div>

        <!-- OPCIÓN DE CÁMARA NATIVA (LENS / FOTO DIRECTA DEL MÓVIL) -->
        <label for="qr-file-input" class="btn-camara-nativa">
            📸 Tomar Foto con Cámara Nativa / Archivo
        </label>
        <input type="file" id="qr-file-input" accept="image/*" capture="environment" style="display: none;">

        <!-- INGRESO MANUAL -->
        <div class="manual-input">
            <input type="text" id="txtCodigoManual" placeholder="Código o ID de Entrada">
            <button class="btn-primary" style="width:auto; padding:10px 15px;" onclick="validarManual()">Validar</button>
        </div>

        <!-- RESULTADO DE LECTURA -->
        <div id="resBox" class="resultado-box"></div>

        <button class="btn-primary" style="background:#dc2626; margin-top:20px; width:100%; max-width:500px;" onclick="volverAlSistema()">
            ⬅️ Volver a Boletería
        </button>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let escaneando = false;

        document.addEventListener('DOMContentLoaded', () => {
            const sesion = JSON.parse(sessionStorage.getItem('usuarioLogueado') || '{}');
            if (sesion.usuario) {
                document.getElementById('lblOperario').innerText = sesion.usuario;
            }

            iniciarEscanerCamara();

            // Listener optimizado para cámara nativa / galería
const fileInput = document.getElementById('qr-file-input');
fileInput.addEventListener('change', async e => {
    if (e.target.files.length === 0) return;
    const imageFile = e.target.files[0];

    // 1. Pausar la cámara en vivo
    if (html5QrCodeScanner) {
        try { await html5QrCodeScanner.clear(); } catch(err) {}
    }

    try {
        // 2. Normalizar la imagen mediante un Canvas para evitar la deformación vertical
        const blobProcesado = await redimensionarImagen(imageFile, 800);
        const archivoLimpio = new File([blobProcesado], "qr_captura.jpg", { type: "image/jpeg" });

        // 3. Procesar el QR con la imagen ya corregida
        const html5QrCode = new Html5Qrcode("qr-reader");
        const qrCodeMessage = await html5QrCode.scanFile(archivoLimpio, true);
        
        await html5QrCode.clear();
        procesarCodigoQR(qrCodeMessage);

    } catch (err) {
        console.error("Error en lectura de foto:", err);
        mostrarResultado(false, "No se pudo detectar un código QR claro. Intenta enfocar más cerca.");
    } finally {
        // 4. Reactivar siempre la cámara en vivo
        iniciarEscanerCamara();
    }
});

// Función para corregir proporciones y resolución de la foto tomada
function redimensionarImagen(file, maxDimension) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
                if (width > maxDimension) {
                    height *= maxDimension / width;
                    width = maxDimension;
                }
            } else {
                if (height > maxDimension) {
                    width *= maxDimension / height;
                    height = maxDimension;
                }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('canvas') || canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.92);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
    });
}
 
        });

        function iniciarEscanerCamara() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "qr-reader", 
                { 
                    fps: 15, 
                    qrbox: { width: 280, height: 280 },
                    aspectRatio: 1.0
                },
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (escaneando) return;
            escaneando = true;

            procesarCodigoQR(decodedText);

            // Reanudar la lectura tras 3 segundos
            setTimeout(() => { escaneando = false; }, 3000);
        }

        function onScanFailure(error) {
            // Ignorar errores continuos de búsqueda de frame
        }

        async function procesarCodigoQR(textoQr) {
            console.log("QR Detectado:", textoQr);

            try {
                // Si el QR es una URL completa (ej: .../entrada.html?id=123&sig=abc)
                let url;
                if (textoQr.startsWith('http://') || textoQr.startsWith('https://')) {
                    url = new URL(textoQr);
                } else {
                    // Si el QR solo trae el ID o JSON
                    url = new URL(`/api/puerta/validar?id=${encodeURIComponent(textoQr)}`, window.location.origin);
                }

                // Redirigir la petición al endpoint de validación del backend
                const idEntrada = url.searchParams.get('id') || textoQr;
                const sig = url.searchParams.get('sig') || '';

                const res = await fetch('/api/puerta/validar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: idEntrada, sig: sig })
                });

                const data = await res.json();

                if (res.ok && data.exito) {
                    mostrarResultado(true, `✅ ACCESO PERMITIDO<br>Asiento: <strong>${data.asiento || ''}</strong><br>Cliente: ${data.cliente || ''}`);
                } else {
                    mostrarResultado(false, `❌ ACCESO DENEGADO<br>${data.mensaje || 'Código inválido o ya utilizado'}`);
                }
            } catch (err) {
                mostrarResultado(false, "Error de comunicación con el servidor.");
            }
        }

        function validarManual() {
            const codigo = document.getElementById('txtCodigoManual').value.trim();
            if (codigo) procesarCodigoQR(codigo);
        }

        function mostrarResultado(exito, mensaje) {
            const box = document.getElementById('resBox');
            box.style.display = 'block';
            box.className = 'resultado-box ' + (exito ? 'exito' : 'error');
            box.innerHTML = mensaje;
        }

        function volverAlSistema() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
