<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso Puerta</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería HTML5 QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
        }

        .puerta-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        /* AMPLIA EL VISOR DE LA CÁMARA */
        #qr-reader {
            width: 100% !important;
            max-width: 500px;
            margin: 15px auto;
            border: 2px solid #334155 !important;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            max-height: 65vh !important;
            object-fit: cover !important;
        }

        #qr-reader__scan_region {
            background: rgba(0,0,0,0.2);
        }

        /* Botón para cámara nativa del celular */
        .btn-camara-nativa {
            background-color: #0d9488;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            display: block;
        }

        .resultado-box {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            display: none;
        }

        .exito { background-color: #166534; color: #4ade80; border: 1px solid #22c55e; }
        .error { background-color: #991b1b; color: #fca5a5; border: 1px solid #ef4444; }

        .manual-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .manual-input input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            width: 65%;
        }
    </style>
</head>
<body>

    <div class="puerta-container">
        <h2>📷 Control de Acceso (Puerta)</h2>
        <p style="font-size:0.85em; color:#94a3b8;">Operador: <span id="lblOperario">-</span></p>

        <!-- VISOR DE CÁMARA WEB EN VIVO (AGRANDADO) -->
        <div id="qr-reader"></div>

        <!-- OPCIÓN DE CÁMARA NATIVA (LENS / FOTO DIRECTA DEL MÓVIL) -->
        <label for="qr-file-input" class="btn-camara-nativa">
            📸 Tomar Foto con Cámara Nativa / Archivo
        </label>
        <input type="file" id="qr-file-input" accept="image/*" capture="environment" style="display: none;">

        <!-- INGRESO MANUAL -->
        <div class="manual-input">
            <input type="text" id="txtCodigoManual" placeholder="Código o ID de Entrada">
            <button class="btn-primary" style="width:auto; padding:10px 15px;" onclick="validarManual()">Validar</button>
        </div>

        <!-- RESULTADO DE LECTURA -->
        <div id="resBox" class="resultado-box"></div>

        <button class="btn-primary" style="background:#dc2626; margin-top:20px; width:100%; max-width:500px;" onclick="volverAlSistema()">
            ⬅️ Volver a Boletería
        </button>
    </div>

    <script>
    let html5QrCode = null;
    document.addEventListener('DOMContentLoaded', () => {
    // 1. Validar que exista un usuario logueado en la sesión
    const sesion = JSON.parse(sessionStorage.getItem('usuarioLogueado') || '{}');
    
    if (!sesion.usuario) {
        alert('⚠️ Acceso no autorizado. Por favor inicia sesión primero.');
        window.location.href = 'index.html';
        return;
    }

    // 2. Mostrar el nombre del operador logueado
    document.getElementById('lblOperario').innerText = sesion.usuario;

    // 3. Inicializar lector de cámara y listeners
    html5QrCode = new Html5Qrcode("qr-reader");
    iniciarCamaraEnVivo();

    const fileInput = document.getElementById('qr-file-input');
    fileInput.addEventListener('change', async e => {
        if (e.target.files.length === 0) return;
        const imageFile = e.target.files[0];

        try {
            if (html5QrCode.isScanning) {
                await html5QrCode.stop();
            }

            const blobProcesado = await redimensionarImagen(imageFile, 800);
            const archivoLimpio = new File([blobProcesado], "qr_captura.jpg", { type: "image/jpeg" });

            const qrCodeMessage = await html5QrCode.scanFile(archivoLimpio, true);
            procesarCodigoQR(qrCodeMessage);

        } catch (err) {
            console.error("Error al leer la foto:", err);
            mostrarResultado(false, "No se pudo detectar un código QR claro en la imagen.");
        } finally {
            setTimeout(() => { iniciarCamaraEnVivo(); }, 3000);
        }
    });
});


    async function iniciarCamaraEnVivo() {
        try {
            if (html5QrCode && html5QrCode.isScanning) return;
            
            await html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // Al detectar con éxito en vivo
                    html5QrCode.pause();
                    procesarCodigoQR(decodedText);
                    setTimeout(() => { 
                        try { html5QrCode.resume(); } catch(e){} 
                    }, 3000);
                },
                (errorMessage) => {
                    // Búsqueda silenciosa frame a frame
                }
            );
        } catch (err) {
            console.log("Cámara en vivo no disponible o sin permisos.");
        }
    }

    async function procesarCodigoQR(textoQr) {
        console.log("QR Detectado:", textoQr);

        let idEntrada = textoQr;
        let sig = '';

        try {
            if (textoQr.startsWith('http://') || textoQr.startsWith('https://')) {
                const urlParsed = new URL(textoQr);
                idEntrada = urlParsed.searchParams.get('id') || textoQr;
                sig = urlParsed.searchParams.get('sig') || '';
            } else if (textoQr.trim().startsWith('{')) {
                const jsonParsed = JSON.parse(textoQr);
                idEntrada = jsonParsed.ticket_id || jsonParsed.id || textoQr;
                sig = jsonParsed.sig || '';
            }

            const res = await fetch('/api/puerta/validar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: idEntrada, sig: sig })
            });

            const data = await res.json();

            if (res.ok && data.exito) {
                mostrarResultado(true, `✅ ACCESO PERMITIDO<br>Asiento: <strong>${data.asiento || ''}</strong><br>Cliente: ${data.cliente || ''}`);
            } else {
                mostrarResultado(false, `❌ ACCESO DENEGADO<br>${data.mensaje || 'Código inválido o ya utilizado'}`);
            }
        } catch (err) {
            mostrarResultado(false, "Error de comunicación o formato de QR no válido.");
        }
    }

    function redimensionarImagen(file, maxDimension) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxDimension) {
                        height *= maxDimension / width;
                        width = maxDimension;
                    }
                } else {
                    if (height > maxDimension) {
                        width *= maxDimension / height;
                        height = maxDimension;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.92);
            };
            img.onerror = reject;
            img.src = URL.createObjectURL(file);
        });
    }

    function validarManual() {
        const codigo = document.getElementById('txtCodigoManual').value.trim();
        if (codigo) procesarCodigoQR(codigo);
    }

    function mostrarResultado(exito, mensaje) {
        const box = document.getElementById('resBox');
        box.style.display = 'block';
        box.className = 'resultado-box ' + (exito ? 'exito' : 'error');
        box.innerHTML = mensaje;
    }

    function volverAlSistema() {
        window.location.href = 'index.html';
    }
</script>

                
</body>
</html>
