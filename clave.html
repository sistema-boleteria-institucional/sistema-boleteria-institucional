<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <title>Elegir clave - Boletería Institucional</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .caja { max-width: 440px; margin: 8vh auto 0; background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 28px; }
        .caja h2 { margin-top: 0; }
        .caja input { width: 100%; box-sizing: border-box; }
        .msg { margin-top: 14px; font-size: 0.95em; line-height: 1.4; }
        .msg.error { color: #ef4444; }
        .msg.ok { color: #22c55e; }
        .ayuda { color: #94a3b8; font-size: 0.85em; }
        .oculto { display: none; }
        a.btn-link { display: block; text-align: center; margin-top: 16px; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="caja">
        <h2 id="titulo">Verificando link...</h2>

        <div id="vistaError" class="oculto">
            <p id="textoError" class="msg error"></p>
            <a class="btn-link" href="index.html">Ir al inicio de sesión</a>
            <p class="ayuda">Si el link venció, en el inicio de sesión tocá «¿Olvidaste tu clave?» para pedir uno nuevo.</p>
        </div>

        <form id="vistaForm" class="oculto" autocomplete="off">
            <p>Usuario: <strong id="lblUsuario"></strong></p>
            <div class="form-group">
                <label for="clave1">Clave nueva:</label>
                <input type="password" id="clave1" autocomplete="new-password" minlength="8" maxlength="128" required>
                <small class="ayuda">Mínimo 8 caracteres. No puede ser igual a tu usuario.</small>
            </div>
            <div class="form-group">
                <label for="clave2">Repetir clave:</label>
                <input type="password" id="clave2" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <button type="submit" class="btn-primary" id="btnGuardar">Guardar clave</button>
            <p id="msgForm" class="msg"></p>
        </form>

        <div id="vistaOk" class="oculto">
            <p class="msg ok">Clave guardada. Ya podés iniciar sesión.</p>
            <a class="btn-link" href="index.html">Ir al inicio de sesión</a>
        </div>
    </div>

    <script>
        (function () {
            var token = new URLSearchParams(location.search).get('token') || '';
            // Saca el token de la barra de direcciones para que no quede en el historial ni al compartir pantalla.
            try { history.replaceState(null, '', location.pathname); } catch (e) {}

            var $ = function (id) { return document.getElementById(id); };
            function mostrar(vista) {
                ['vistaError', 'vistaForm', 'vistaOk'].forEach(function (v) { $(v).classList.toggle('oculto', v !== vista); });
            }
            function post(url, body) {
                return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                    .then(function (r) { return r.json(); });
            }
            function error(texto) {
                $('titulo').textContent = 'No se pudo continuar';
                $('textoError').textContent = texto;
                mostrar('vistaError');
            }

            if (!token) { error('El link no es válido o ya venció. Pedí uno nuevo.'); return; }

            post('/api/clave/verificar', { token: token }).then(function (d) {
                if (!d.exito) return error(d.mensaje || 'El link no es válido o ya venció. Pedí uno nuevo.');
                $('titulo').textContent = d.tipo === 'alta' ? 'Creá tu clave' : 'Elegí tu clave nueva';
                $('lblUsuario').textContent = d.usuario;
                mostrar('vistaForm');
                $('clave1').focus();
            }).catch(function () { error('No hay conexión con el servidor. Probá de nuevo en unos segundos.'); });

            $('vistaForm').addEventListener('submit', function (ev) {
                ev.preventDefault();
                var msg = $('msgForm');
                msg.className = 'msg';
                msg.textContent = '';
                var c1 = $('clave1').value, c2 = $('clave2').value;
                if (c1.length < 8) { msg.className = 'msg error'; msg.textContent = 'La clave debe tener al menos 8 caracteres.'; return; }
                if (c1 !== c2) { msg.className = 'msg error'; msg.textContent = 'Las dos claves no coinciden.'; return; }
                $('btnGuardar').disabled = true;
                post('/api/clave/fijar', { token: token, clave: c1 }).then(function (d) {
                    if (d.exito) { $('titulo').textContent = '¡Listo!'; mostrar('vistaOk'); return; }
                    $('btnGuardar').disabled = false;
                    msg.className = 'msg error';
                    msg.textContent = d.mensaje || 'No se pudo guardar la clave.';
                }).catch(function () {
                    $('btnGuardar').disabled = false;
                    msg.className = 'msg error';
                    msg.textContent = 'No hay conexión con el servidor. Probá de nuevo.';
                });
            });
        })();
    </script>
</body>
</html>
