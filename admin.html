<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Ventas e Historial</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; color: #0f172a; margin: 0; padding: 30px; }
        .container { max-width: 1200px; margin: 0 auto; display: none; } /* Oculto por defecto hasta loguearse */
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; flex: 1; text-align: center; }
        .stat-box h3 { margin: 0; font-size: 0.9rem; color: #64748b; text-transform: uppercase; }
        .stat-box p { margin: 10px 0 0 0; font-size: 1.8rem; font-weight: bold; color: #0f172a; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-excel { background-color: #16a34a; color: white; }
        .btn-email { background-color: #2563eb; color: white; }
        .btn-logout { background-color: #ef4444; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #1e293b; color: white; }
        tr:hover { background-color: #f8fafc; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }

        /* Estilos para el Modal de Login */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-box h2 { margin-top: 0; color: #1e293b; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #475569; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn-login {
            width: 100%;
            background-color: #1e293b;
            color: white;
            padding: 12px;
            font-size: 1rem;
            margin-top: 10px;
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- MODAL DE LOGIN DENTRO DE ADMIN.HTML -->
    <div id="modalLogin" class="modal-overlay">
        <div class="login-box">
            <h2>Acceso Administrativo</h2>
            <p style="color: #64748b; font-size: 0.9rem;">Ingresa tus credenciales para acceder</p>
            <form id="formLogin" onsubmit="procesarLogin(event)">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" required placeholder="Ej: admin">
                </div>
                <div class="form-group">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-login">Ingresar al Panel</button>
                <div id="mensajeError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- CONTENIDO DEL DASHBOARD -->
    <div id="contenidoDashboard" class="container">
        <div class="card">
            <div class="header">
                <h1 id="tituloEvento">Reporte de Ventas</h1>
                <div>
                    <button class="btn btn-excel" onclick="window.location.href='/api/eventos/EV-101/descargar-excel'">Descargar Excel</button>
                    <button class="btn btn-email" onclick="enviarEmail()">Enviar por Email</button>
                    <button class="btn btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <h3>Ventas Totales</h3>
                    <p id="recaudado" style="color:#16a34a;">$0 ARS</p>
                </div>
                <div class="stat-box">
                    <h3>Entradas Vendidas</h3>
                    <p id="totalVentas">0</p>
                </div>
                <div class="stat-box">
                    <h3>Asistencia en Puerta</h3>
                    <p id="asistencia" style="color:#2563eb;">0</p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID Reserva</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Email</th>
                        <th>Asiento</th>
                        <th>Método</th>
                        <th>Monto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaVentas"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Al cargar la página, verificamos si ya hay una sesión activa guardada
        document.addEventListener('DOMContentLoaded', () => {
            const sesion = JSON.parse(localStorage.getItem('usuarioLogueado') || '{}');
            if (sesion.tipo === 'super' || sesion.tipo === 'adm') {
                ocultarModalYMostrarDashboard(sesion);
            }
        });

        async function procesarLogin(event) {
            event.preventDefault();
            const usuarioInput = document.getElementById('usuario').value.trim();
            const claveInput = document.getElementById('clave').value.trim();
            const divError = document.getElementById('mensajeError');

            divError.style.display = 'none';

            try {
                // Petición al backend para verificar usuario y clave contra la BD
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioInput, clave: claveInput })
                });

                const data = await res.json();

                if (!res.ok || !data.exito) {
                    divError.innerText = data.mensaje || 'Credenciales incorrectas.';
                    divError.style.display = 'block';
                    return;
                }

                // VALIDACIÓN CLAVE: Verificamos que el tipo registrado en la BD sea 'super' o 'adm'
                const rol = data.usuario.tipo; 
                if (rol !== 'super' && rol !== 'adm') {
                    divError.innerText = 'Acceso denegado: Tu usuario no es administrador.';
                    divError.style.display = 'block';
                    return;
                }

                // Si las credenciales y el rol son correctos, guardamos y mostramos el panel
                localStorage.setItem('usuarioLogueado', JSON.stringify(data.usuario));
                ocultarModalYMostrarDashboard(data.usuario);

            } catch (error) {
                console.error('Error durante el inicio de sesión:', error);
                divError.innerText = 'Error al conectar con el servidor.';
                divError.style.display = 'block';
            }
        }

        function ocultarModalYMostrarDashboard(usuarioSesion) {
            document.getElementById('modalLogin').style.display = 'none';
            document.getElementById('contenidoDashboard').style.display = 'block';
            cargarDashboard(usuarioSesion);
        }

        async function cargarDashboard(usuarioSesion) {
            try {
                const res = await fetch('/api/eventos/EV-101/historial', {
                    headers: { 
                        'X-User-Id': usuarioSesion.id || '',
                        'X-User-Role': usuarioSesion.tipo || ''
                    }
                });

                if (!res.ok) {
                    alert('Error o falta de permisos para obtener los datos.');
                    cerrarSesion();
                    return;
                }

                const data = await res.json();
                document.getElementById('tituloEvento').innerText = `Reporte: ${data.nombre || 'Sin Nombre'}`;
                document.getElementById('recaudado').innerText = `$${(data.recaudado || 0).toLocaleString()} ARS`;
                document.getElementById('totalVentas').innerText = data.totalVentas || 0;
                document.getElementById('asistencia').innerText = data.asistencia || 0;

                const tbody = document.getElementById('tablaVentas');
                tbody.innerHTML = '';
                
                if (data.historialVentas) {
                    data.historialVentas.forEach(v => {
                        const esOk = v.estado === 'Completado';
                        tbody.innerHTML += `
                            <tr>
                                <td>${v.idReserva}</td>
                                <td>${v.fecha}</td>
                                <td>${v.cliente}</td>
                                <td>${v.email}</td>
                                <td><strong>${v.asiento}</strong></td>
                                <td>${v.metodoPago}</td>
                                <td>$${v.monto}</td>
                                <td><span class="badge ${esOk ? 'badge-success' : 'badge-warning'}">${v.estado}</span></td>
                            </tr>`;
                    });
                }
            } catch (e) {
                console.error("Error al cargar el dashboard:", e);
            }
        }

        async function enviarEmail() {
            const email = prompt("Ingresa el correo de destino para enviar el informe:");
            if (!email) return;

            const usuarioSesion = JSON.parse(localStorage.getItem('usuarioLogueado') || '{}');

            const res = await fetch('/api/eventos/EV-101/enviar-email', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-User-Role': usuarioSesion.tipo || ''
                },
                body: JSON.stringify({ emailDestino: email })
            });
            const data = await res.json();
            alert(data.mensaje || data.error);
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            window.location.reload();
        }
    </script>
</body>
</html>
