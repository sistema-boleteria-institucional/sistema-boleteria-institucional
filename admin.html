<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Ventas e Historial</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; color: #0f172a; margin: 0; padding: 30px; }
        .container { max-width: 1200px; margin: 0 auto; display: none; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .selector-box { display: flex; align-items: center; gap: 10px; }
        .selector-box select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: bold; font-size: 0.95rem; }
        .stats { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; flex: 1; text-align: center; }
        .stat-box h3 { margin: 0; font-size: 0.9rem; color: #64748b; text-transform: uppercase; }
        .stat-box p { margin: 10px 0 0 0; font-size: 1.8rem; font-weight: bold; color: #0f172a; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-excel { background-color: #16a34a; color: white; }
        .btn-email { background-color: #2563eb; color: white; }
        .btn-logout { background-color: #ef4444; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #1e293b; color: white; }
        tr:hover { background-color: #f8fafc; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .badge-success { background: #dcfce7; color: #166534; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #475569; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; background-color: #1e293b; color: white; padding: 12px; font-size: 1rem; margin-top: 10px; }
        .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- MODAL DE LOGIN -->
    <div id="modalLogin" class="modal-overlay">
        <div class="login-box">
            <h2>Acceso Administrativo</h2>
            <p style="color: #64748b; font-size: 0.9rem;">Ingresa tus credenciales para acceder</p>
            <form id="formLogin" onsubmit="procesarLogin(event)">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" required placeholder="Ej: PEPE o admin">
                </div>
                <div class="form-group">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-login">Ingresar al Panel</button>
                <div id="mensajeError" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- CONTENIDO DEL DASHBOARD -->
    <div id="contenidoDashboard" class="container">
        <div class="card">
            <div class="header">
                <div class="selector-box">
                    <label for="selectEvento"><strong>Filtrar Evento:</strong></label>
                    <select id="selectEvento" onchange="cargarDashboard()">
                        <option value="TODOS">-- Todos los Eventos --</option>
                        <option value="EV-2026-01">EV-2026-01</option>
                        <option value="EV-2026-02">EV-2026-02</option>
                        <option value="EV-2026-03">EV-2026-03</option>
                    </select>
                </div>
                <div>
                    <button class="btn btn-excel" onclick="descargarExcel()">Descargar Excel</button>
                    <button class="btn btn-email" onclick="enviarEmail()">Enviar por Email</button>
                    <button class="btn btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>

            <h1 id="tituloEvento">Cargando reporte...</h1>

            <div class="stats">
                <div class="stat-box">
                    <h3>Ventas Totales</h3>
                    <p id="recaudado" style="color:#16a34a;">$0 ARS</p>
                </div>
                <div class="stat-box">
                    <h3>Entradas Vendidas</h3>
                    <p id="totalVentas">0</p>
                </div>
                <div class="stat-box">
                    <h3>Asistencia en Puerta</h3>
                    <p id="asistencia" style="color:#2563eb;">0</p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Evento</th>
                        <th>ID Reserva</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Email</th>
                        <th>Asiento</th>
                        <th>Método</th>
                        <th>Monto</th>
                    </tr>
                </thead>
                <tbody id="tablaVentas">
                    <tr><td colspan="8" style="text-align: center;">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sesion = JSON.parse(localStorage.getItem('usuarioLogueado') || '{}');
            const rol = String(sesion.tipo || sesion.Tipo || sesion.rol || sesion.Rol || '').toLowerCase();
            if (rol === 'super' || rol === 'adm' || rol === 'admin') {
                ocultarModalYMostrarDashboard(sesion);
            }
        });

        async function procesarLogin(event) {
            event.preventDefault();
            const usuarioInput = document.getElementById('usuario').value.trim();
            const claveInput = document.getElementById('clave').value.trim();
            const divError = document.getElementById('mensajeError');

            divError.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioInput, clave: claveInput })
                });

                const data = await res.json();

                if (!res.ok || !data.exito) {
                    divError.innerText = data.mensaje || 'Usuario o contraseña incorrectos.';
                    divError.style.display = 'block';
                    return;
                }

                const tipoDB = String(data.tipo || data.rol || (typeof data.usuario === 'object' ? data.usuario.tipo : '') || '').toLowerCase().trim();

                if (tipoDB !== 'super' && tipoDB !== 'adm' && tipoDB !== 'admin') {
                    divError.innerText = `Acceso denegado.`;
                    divError.style.display = 'block';
                    return;
                }

                const usuarioSesion = typeof data.usuario === 'object' ? data.usuario : data;
                usuarioSesion.tipo = tipoDB;
                localStorage.setItem('usuarioLogueado', JSON.stringify(usuarioSesion));
                ocultarModalYMostrarDashboard(usuarioSesion);

            } catch (error) {
                divError.innerText = "Error de conexión con el servidor.";
                divError.style.display = 'block';
            }
        }

        async function ocultarModalYMostrarDashboard(usuarioSesion) {
            document.getElementById('modalLogin').style.display = 'none';
            document.getElementById('contenidoDashboard').style.display = 'block';
            await cargarListaEventos();
            cargarDashboard();
        }

        async function cargarListaEventos() {
            try {
                const res = await fetch('/api/lista-eventos');
                if (!res.ok) return;
                const data = await res.json();
                
                if (data.eventos && data.eventos.length > 0) {
                    const select = document.getElementById('selectEvento');
                    select.innerHTML = '<option value="TODOS">-- Todos los Eventos --</option>';
                    data.eventos.forEach(evId => {
                        select.innerHTML += `<option value="${evId}">${evId}</option>`;
                    });
                }
            } catch(e) {
                console.error("Error cargando lista de eventos", e);
            }
        }

        async function cargarDashboard() {
            const eventoId = document.getElementById('selectEvento').value;
            const tbody = document.getElementById('tablaVentas');
            const titulo = document.getElementById('tituloEvento');

            try {
                const res = await fetch(`/api/eventos/${eventoId}/historial`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();

                titulo.innerText = `Reporte: ${data.nombre}`;
                document.getElementById('recaudado').innerText = `$${(data.recaudado || 0).toLocaleString()} ARS`;
                document.getElementById('totalVentas').innerText = data.totalVentas || 0;
                document.getElementById('asistencia').innerText = data.asistencia || 0;

                const ventas = data.historialVentas || [];
                tbody.innerHTML = '';
                
                if (ventas.length > 0) {
                    ventas.forEach(v => {
                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${v.eventoId || '-'}</strong></td>
                                <td>${v.idReserva || '-'}</td>
                                <td>${v.fecha ? new Date(v.fecha).toLocaleDateString() : '-'}</td>
                                <td>${v.cliente || '-'}</td>
                                <td>${v.email || '-'}</td>
                                <td><strong>${v.asiento || '-'}</strong></td>
                                <td>${v.metodoPago || '-'}</td>
                                <td>$${v.monto || 0}</td>
                            </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No hay registros de ventas para la selección.</td></tr>';
                }
            } catch (e) {
                titulo.innerText = `Reporte de Ventas`;
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #dc2626;">Error al consultar el servidor: ${e.message}</td></tr>`;
            }
        }

        function descargarExcel() {
            const eventoId = document.getElementById('selectEvento').value;
            window.location.href = `/api/eventos/${eventoId}/descargar-excel`;
        }

        async function enviarEmail() {
            const eventoId = document.getElementById('selectEvento').value;
            const email = prompt("Ingresa el correo de destino para enviar el informe:");
            if (!email) return;

            try {
                const res = await fetch('/api/config/email-informe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, eventoId })
                });
                const data = await res.json();
                alert(data.mensaje || 'Operación completada');
            } catch (err) {
                alert("Error enviando el correo.");
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            window.location.reload();
        }
    </script>
</body>
</html>
